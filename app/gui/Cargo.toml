[package]
name = "toolbox-gui"
description = "Garuda Toolbox, the egui app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "garuda-toolbox"
path = "src/main.rs"

# Without `testing` cargo skips this target instead of failing.
[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["testing"]

[features]
selftest = ["dep:kittest", "dep:image", "toolbox-services/selftest", "toolbox-system/selftest"]
profiling = ["dep:tracing-tracy"]
testing = ["dep:egui_kittest", "toolbox-gui-kit/testing", "toolbox-services/testing", "toolbox-system/testing"]

[dependencies]
toolbox-aur.workspace = true
toolbox-news.workspace = true
toolbox-catalog.workspace = true
toolbox-cli.workspace = true
toolbox-commands.workspace = true
clap.workspace = true
toolbox-config.workspace = true
toolbox-core.workspace = true
toolbox-exec.workspace = true
toolbox-gui-kit.workspace = true
toolbox-guide.workspace = true
toolbox-https.workspace = true
toolbox-instance.workspace = true
toolbox-log.workspace = true
toolbox-plan.workspace = true
toolbox-privatebin.workspace = true
toolbox-pty.workspace = true
toolbox-services.workspace = true
toolbox-system.workspace = true
toolbox-terminal.workspace = true
ashpd.workspace = true
crossbeam-channel.workspace = true
eframe.workspace = true
egui.workspace = true
fluent-templates.workspace = true
fontdb.workspace = true
freedesktop-icons.workspace = true
futures-lite.workspace = true
tracing.workspace = true
notify.workspace = true
parking_lot.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
zbus.workspace = true
kittest = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tracing-tracy = { workspace = true, optional = true }
egui_kittest = { workspace = true, optional = true }

[dev-dependencies]
toolbox-gui-kit = { workspace = true, features = ["testing"] }
toolbox-services = { workspace = true, features = ["testing"] }
toolbox-system = { workspace = true, features = ["selftest", "testing"] }
toolbox-core = { workspace = true, features = ["testing"] }
toolbox-plan = { workspace = true, features = ["testing"] }
toolbox-pty = { workspace = true, features = ["testing"] }
toolbox-state = { workspace = true, features = ["testing"] }
tempfile.workspace = true
toolbox-exec.workspace = true
egui_kittest.workspace = true
strum.workspace = true

[lints]
workspace = true
