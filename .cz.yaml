---
# The cargo provider only knows `[package]`, not `[workspace.package]`.
commitizen:
  name: cz_conventional_commits
  tag_format: $version
  version: 6.3.0
  version_provider: commitizen
  version_scheme: semver
  version_files:
    - Cargo.toml:^version =
    - packaging/PKGBUILD:^pkgver=
    - nix/package.nix:^  version =
  # git-cliff writes CHANGELOG.md.
  update_changelog_on_bump: false
  pre_bump_hooks:
    - cargo update --workspace --offline
    - cargo xtask cli-docs
    - git add Cargo.lock data/cli
