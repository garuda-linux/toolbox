[package]
name = "toolbox-system"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The dry run's sample machine, left out of a release.
selftest = ["toolbox-state/selftest"]
# Constructors the GUI tests need to read captured system files.
testing = []

[dependencies]
alpm.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
toolbox-exec.workspace = true
toolbox-catalog.workspace = true
toolbox-plan.workspace = true
toolbox-state.workspace = true
toolbox-log.workspace = true
toolbox-pty.workspace = true
zbus.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
toolbox-https.workspace = true
toolbox-privatebin.workspace = true
tempfile.workspace = true

[dev-dependencies]
toolbox-state = { workspace = true, features = ["selftest"] }

[lints]
workspace = true
