[package]
name = "toolbox-system"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The dry run's sample machine, left out of a release.
selftest = ["toolbox-state/selftest"]
# Constructors the GUI tests need to read captured system files, and the
# captures in `testing` for the tests of other crates.
testing = []

[dependencies]
alpm.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rustix = { workspace = true, features = ["fs", "process"] }
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true
toolbox-exec.workspace = true
toolbox-catalog.workspace = true
toolbox-plan.workspace = true
toolbox-state.workspace = true
toolbox-calendar.workspace = true
toolbox-pty.workspace = true
zbus.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "macros", "time"] }
tempfile.workspace = true

[dev-dependencies]
toolbox-exec = { workspace = true, features = ["testing"] }
toolbox-plan = { workspace = true, features = ["testing"] }
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
toolbox-state = { workspace = true, features = ["selftest", "testing"] }

[lints]
workspace = true
