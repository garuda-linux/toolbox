	menuentry 'Garuda Linux, with Linux linux-zen' --class garuda --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-linux-zen-advanced-3f1c9a52-7d0e-4b6a-9c1f-2e8d5a7b4c10' {
		savedefault
		load_video
		if [ "x$grub_platform" = xefi ]; then
			set gfxpayload=keep
		fi
		echo	'Loading Linux linux-zen ...'
		linux	/@/boot/vmlinuz-linux-zen root=UUID=3f1c9a52-7d0e-4b6a-9c1f-2e8d5a7b4c10 rw rootflags=subvol=@  quiet splash loglevel=3
		initrd	/@/boot/intel-ucode.img /@/boot/initramfs-linux-zen.img
	}
	menuentry 'Garuda Linux, with Linux linux-zen (fallback initramfs)' --class garuda --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-linux-zen-fallback-3f1c9a52-7d0e-4b6a-9c1f-2e8d5a7b4c10' {
		savedefault
		load_video
		linux	/@/boot/vmlinuz-linux-zen root=UUID=3f1c9a52-7d0e-4b6a-9c1f-2e8d5a7b4c10 rw rootflags=subvol=@
		initrd	/@/boot/intel-ucode.img /@/boot/initramfs-linux-zen-fallback.img
	}
	menuentry 'Garuda Linux, with Linux linux-lts' --class garuda --class gnu-linux --class gnu --class os $menuentry_id_option 'gnulinux-linux-lts-advanced-3f1c9a52-7d0e-4b6a-9c1f-2e8d5a7b4c10' {
