	insmod btrfs
	search --no-floppy --fs-uuid --set=root 3f1c9a52-7d0e-4b6a-9c1f-2e8d5a7b4c10
	echo	'Loading Linux linux-zen ...'
	linux	/@/boot/vmlinuz-linux-zen root=UUID=3f1c9a52-7d0e-4b6a-9c1f-2e8d5a7b4c10 rw rootflags=subvol=@  quiet splash loglevel=3
	echo	'Loading initial ramdisk ...'
