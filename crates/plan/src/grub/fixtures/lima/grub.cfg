### BEGIN /etc/grub.d/60_memtest86+ ###
if [ "${grub_platform}" == "pc" ]; then
    menuentry "Memory Tester (memtest86+)" --class memtest86 --class memtest --class gnu --class tool {
        search --fs-uuid --no-floppy --set=root  cd2fff21-4bb7-40f3-a158-406f545e11e6
        linux16 /@/boot/memtest86+/memtest.bin 
    }
fi
### END /etc/grub.d/60_memtest86+ ###

### BEGIN /etc/grub.d/60_memtest86+-efi ###
if [ "${grub_platform}" == "efi" ]; then
    menuentry "Memory Tester (memtest86+)" --class memtest86 --class memtest --class gnu --class tool {
        if loadfont unicode ; then
            set gfxmode=1024x768,800x600,auto
            set gfxpayload=800x600,1024x768
            terminal_output gfxterm
        fi
        search --fs-uuid --no-floppy --set=root  cd2fff21-4bb7-40f3-a158-406f545e11e6
        linux /@/boot/memtest86+/memtest86x64.efi 
    }
fi
### END /etc/grub.d/60_memtest86+-efi ###

