[package]
name = "toolbox-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# The captures in `testing`, for the tests of other crates.
testing = []

[dependencies]
toolbox-catalog.workspace = true
toolbox-plan.workspace = true
toolbox-state.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
strum.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
toolbox-plan = { workspace = true, features = ["testing"] }
toolbox-system = { workspace = true, features = ["testing"] }
criterion.workspace = true
toolbox-state = { workspace = true, features = ["selftest", "testing"] }

[[bench]]
name = "search"
harness = false
