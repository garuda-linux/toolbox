[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
# zbus 5 (via accesskit and ashpd) trips RUSTSEC-2026-0370 to 0372 as unmaintained.
unmaintained = "workspace"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-only",
    "ISC",
    "LGPL-3.0-only",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
version = 2

# alpm and alpm-sys declare the deprecated "GPL-3.0", which means GPL-3.0-only.
[[licenses.clarify]]
crate = "alpm"
expression = "GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "alpm-sys"
expression = "GPL-3.0-only"
license-files = []

# Per crate, so another crate under these licenses gets reviewed first.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]


[licenses.private]
ignore = true

[bans]
allow-wildcard-paths = true
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
