[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
# zbus 6 took these crates in, but accesskit_unix and atspi in eframe 0.37
# still pull zbus 5. Drop the entries once accesskit moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "2026-11-08: zvariant 5, via zbus 5 in accesskit_unix and atspi" },
    { id = "RUSTSEC-2026-0371", reason = "2026-11-08: zbus_names 4, via zbus 5 in accesskit_unix and atspi" },
    { id = "RUSTSEC-2026-0372", reason = "2026-11-08: zvariant_derive 5, via zbus 5 in accesskit_unix and atspi" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "GPL-3.0-only",
    "ISC",
    "LGPL-3.0-only",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
version = 2

# alpm and alpm-sys declare the deprecated "GPL-3.0", which means GPL-3.0-only.
[[licenses.clarify]]
crate = "alpm"
expression = "GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "alpm-sys"
expression = "GPL-3.0-only"
license-files = []

# Per crate, so another crate under these licenses gets reviewed first.
[[licenses.exceptions]]
crate = "notify"
allow = ["CC0-1.0"]

[[licenses.exceptions]]
crate = "xxhash-rust"
allow = ["BSL-1.0"]


[licenses.private]
ignore = true

[bans]
allow-wildcard-paths = true
multiple-versions = "warn"
wildcards = "deny"
# Each older copy and who still pulls it, checked 2026-11-09. A new
# duplicate warns, these do not. Drop an entry once its puller moves on.
skip = [
    { crate = "base64@0.22.1", reason = "alacritty_terminal, usvg" },
    { crate = "bitflags@1.3.2", reason = "png 0.17 in tiny-skia" },
    { crate = "calloop@0.13.0", reason = "winit and smithay-client-toolkit 0.19" },
    { crate = "calloop-wayland-source@0.3.0", reason = "smithay-client-toolkit 0.19 in winit" },
    { crate = "foldhash@0.1.5", reason = "hashbrown 0.15 in petgraph" },
    { crate = "getrandom@0.2.17", reason = "ring" },
    { crate = "getrandom@0.3.4", reason = "ahash" },
    { crate = "hashbrown@0.15.5", reason = "petgraph" },
    { crate = "hashbrown@0.16.1", reason = "gpu-allocator" },
    { crate = "kurbo@0.11.3", reason = "usvg, svgtypes" },
    { crate = "linux-raw-sys@0.4.15", reason = "rustix 0.38 in calloop 0.13" },
    { crate = "lock_api@0.4.14", reason = "parking_lot 0.12, spin" },
    { crate = "miniz_oxide@0.8.9", reason = "png 0.17 in tiny-skia" },
    { crate = "parking_lot@0.12.5", reason = "eframe, arboard, alacritty_terminal" },
    { crate = "parking_lot_core@0.9.12", reason = "parking_lot 0.12" },
    { crate = "phf@0.11.3", reason = "mime_guess2" },
    { crate = "phf_shared@0.11.3", reason = "mime_guess2" },
    { crate = "png@0.17.16", reason = "tiny-skia" },
    { crate = "quick-xml@0.41.0", reason = "wayland-scanner" },
    { crate = "read-fonts@0.41.0", reason = "fontique, harfrust" },
    { crate = "rustc-hash@1.1.0", reason = "naga, wgpu-core" },
    { crate = "rustix@0.38.44", reason = "calloop 0.13 and smithay-client-toolkit 0.19 in winit" },
    { crate = "skrifa@0.44.0", reason = "epaint, egui_system_font_provider" },
    { crate = "smithay-client-toolkit@0.19.2", reason = "winit" },
    { crate = "syn@2.0.119", reason = "proc macros: enumflags2_derive, enumn, fluent-template-macros" },
    { crate = "thiserror@1.0.69", reason = "calloop 0.13, freedesktop-icons, smithay-client-toolkit 0.19" },
    { crate = "thiserror-impl@1.0.69", reason = "thiserror 1" },
    { crate = "zbus@5.19.0", reason = "accesskit_unix and atspi in eframe 0.37" },
    { crate = "zbus_macros@5.19.0", reason = "zbus 5" },
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
