# `icon` is a freedesktop or Breeze icon name.
# `requires = { all = [..] }` needs every listed entry on, `{ any = [..] }` at least one.

[[section]]
id = "audio"
title = "Audio"
icon = "audio-volume-high"

[[section.entry]]
id = "pipewire-support"
title = "PipeWire"
description = "The modern standard for handling audio and video streams on Linux. It seamlessly replaces PulseAudio and JACK with much lower latency and better security."
check = { package = "pipewire-support" }

[[section.entry]]
id = "jack-support"
title = "JACK"
description = "A specialized, low-latency sound server designed for professional audio production. Usually handled natively by PipeWire now."
check = { package = "jack-support" }

[[section.entry]]
id = "pulseaudio-support"
title = "PulseAudio"
description = "The older, legacy sound server. Kept primarily for compatibility, but PipeWire has largely replaced it."
check = { package = "pulseaudio-support" }

[[section.entry]]
id = "group-realtime"
title = "Realtime group"
description = "Adds your user to the realtime group, giving audio applications CPU priority to prevent stuttering and latency."
check = { group = "realtime" }

[[section.entry]]
id = "easyeffects"
title = "EasyEffects"
description = "A powerful tool to enhance your microphone quality and audio playback. Highly recommended to install 'Calf Plugins' and 'LSP Plugins' alongside this for a complete experience."
check = { package = "easyeffects" }

[[section.entry]]
id = "lsp-plugins"
title = "LSP Plugins"
description = "Linux Studio Plugins (LSP). A collection of professional audio tools like equalizers and compressors. Install this to expand EasyEffects' capabilities."
check = { package = "lsp-plugins-lv2" }

[[section.entry]]
id = "calf"
title = "Calf plugins"
description = "Calf Studio Gear. A high-quality set of audio processing plugins. Install this to give EasyEffects more professional studio effects."
check = { package = "calf" }

[[section.entry]]
id = "jamesdsp"
title = "JamesDSP"
description = "An audio effect processor for adding bass boost, equalizers, and other effects. It is recommended to try EasyEffects first."
check = { package = "jamesdsp" }
requires = { all = ["pipewire-support"] }

[[section]]
id = "virtualization"
title = "Virtualization"
icon = "computer"

[[section.entry]]
id = "virt-manager"
title = "Virt Manager"
description = "A powerful desktop application (GUI) for creating and managing KVM/QEMU virtual machines."
check = { package = "virt-manager-meta" }

[[section.entry]]
id = "enabled-libvirtd"
title = "Libvirtd"
description = "The system daemon required to run and manage virtual machines and other virtualization platforms."
check = { service = "libvirtd.service" }
requires = { all = ["virt-manager"] }

[[section.entry]]
id = "group-libvirt"
title = "libvirt users"
description = "Adds your user to the libvirt group, granting permission to manage advanced KVM/QEMU virtual machines."
check = { group = "libvirt" }
requires = { all = ["virt-manager"] }

[[section.entry]]
id = "group-kvm"
title = "KVM users"
description = "Adds your user to the kvm group, granting permission to use fast, hardware-accelerated KVM virtual machines."
check = { group = "kvm" }
requires = { any = ["virt-manager", "qemu"] }

[[section.entry]]
id = "qemu"
title = "QEMU"
description = "A generic, open-source machine emulator and virtualizer. Can run operating systems for any machine, on any machine."
check = { package = "qemu-desktop" }

[[section.entry]]
id = "virtualbox"
title = "VirtualBox"
description = "Oracle's popular cross-platform virtualization software. Very user-friendly, though generally slower than KVM/Virt-Manager."
check = { package = "virtualbox-meta" }

[[section.entry]]
id = "group-vboxusers"
title = "VirtualBox users"
description = "Adds your user to the vboxusers group, granting permission to use VirtualBox."
check = { group = "vboxusers" }
requires = { all = ["virtualbox"] }

[[section.entry]]
id = "qemu-user-static"
title = "QEMU User Static"
description = "Can be used to Run foreign architecture binaries natively, i.e. via Podman"
check = { package = "qemu-user-static" }

[[section.entry]]
id = "qemu-user-static-binfmt"
title = "QEMU Binfmt"
description = "Register foreign arch handlers in kernel, this can be useful when attempting to run aarch64 container images."
check = { package = "qemu-user-static-binfmt" }

[[section]]
id = "containers"
title = "Containers"
icon = "package"

[[section.entry]]
id = "docker"
title = "Docker"
description = "The industry-standard container engine for packaging and running isolated applications."
check = { package = "docker" }

[[section.entry]]
id = "enabled-docker"
title = "Docker service"
description = "Runs the background daemon required to manage and run Docker containers."
check = { service = "docker.service" }
requires = { all = ["docker"] }

[[section.entry]]
id = "group-docker"
title = "Docker users"
description = "Adds your user to the docker group, granting permission to run Docker commands without sudo."
check = { group = "docker" }
requires = { all = ["docker"] }

[[section.entry]]
id = "docker-compose"
title = "Docker Compose"
description = "A tool for defining and running multi-container Docker applications via configuration files."
check = { package = "docker-compose" }
requires = { any = ["docker", "podman"] }

[[section.entry]]
id = "podman"
title = "Podman"
description = "A modern, daemonless alternative to Docker. It runs containers without needing root privileges, offering better security."
check = { package = "podman" }

[[section.entry]]
id = "podman-desktop"
title = "Podman Desktop"
description = "A graphical application to easily manage, create, and view your Podman containers."
check = { package = "podman-desktop" }
requires = { all = ["podman"] }

[[section.entry]]
id = "podman-docker"
title = "Podman Docker"
description = "A compatibility package that aliases the 'docker' command to 'podman', so existing Docker scripts work seamlessly with Podman."
check = { package = "podman-docker" }
requires = { all = ["podman"] }

[[section.entry]]
id = "distrobox"
title = "Distrobox"
description = "Creates tightly integrated containers of other Linux distributions. Lets you install and run apps from Ubuntu, Fedora, or Arch natively inside Garuda."
check = { package = "distrobox" }
requires = { any = ["podman", "docker"] }

[[section.entry]]
id = "kontainer"
title = "Kontainer"
description = "A native KDE application for managing Distrobox containers with ease."
check = { package = "kontainer" }
requires = { all = ["distrobox"] }

[[section.entry]]
id = "boxbuddy"
title = "BoxBuddy"
description = "A graphical app to easily manage and use your Distrobox environments."
check = { package = "boxbuddy" }
requires = { all = ["distrobox"] }

[[section.entry]]
id = "winboat"
title = "WinBoat"
description = "Uses containerization to provide seamlessly integrated Windows apps on Linux."
check = { package = "winboat" }
requires = { any = ["podman", "docker"] }

[[section]]
id = "network"
title = "Network"
icon = "network-wired"

[[section.entry]]
id = "networkmanager"
title = "NetworkManager"
description = "The core daemon that configures and manages your Wi-Fi, Ethernet, and VPN connections."
check = { package = "networkmanager" }

[[section.entry]]
id = "enabled-networkmanager"
title = "NetworkManager service"
description = "Runs the NetworkManager daemon so you can connect to the internet."
check = { service = "NetworkManager.service" }
requires = { all = ["networkmanager"] }

[[section.entry]]
id = "enabled-modemmanager"
title = "ModemManager"
description = "Runs the daemon required to connect to the internet using mobile broadband (4G/5G USB modems)."
check = { service = "ModemManager.service" }
requires = { all = ["networkmanager"] }

[[section]]
id = "bluetooth"
title = "Bluetooth"
icon = "preferences-system-bluetooth"

[[section.entry]]
id = "bluetooth-support"
title = "Bluetooth support"
description = "The BlueZ Linux Bluetooth stack. Provides the core software needed to handle wireless devices."
check = { package = "bluetooth-support" }

[[section.entry]]
id = "enabled-bluetooth"
title = "Bluetooth service"
description = "Runs the background service required to pair and connect to Bluetooth devices."
check = { service = "bluetooth.service" }
requires = { all = ["bluetooth-support"] }

[[section.entry]]
id = "autoconnect"
title = "Auto connect"
description = "Automatically reconnects to your trusted, previously paired Bluetooth devices when they power on."
check = { package = "bluetooth-autoconnect" }
requires = { all = ["bluetooth-support"] }

[[section.entry]]
id = "autoconnect-enabled"
title = "Auto connect service"
description = "Runs the background service that actively handles automatic Bluetooth reconnections."
check = { service = "bluetooth-autoconnect.service" }
requires = { all = ["autoconnect"] }

[[section]]
id = "printing"
title = "Printing"
icon = "printer"

[[section.entry]]
id = "printing-support"
title = "Printing support"
description = "CUPS (Common Unix Printing System). The core software needed to connect and print to local or network printers."
check = { package = "printer-support" }

[[section.entry]]
id = "scanning-support"
title = "SANE"
description = "SANE (Scanner Access Now Easy). The core software needed to use flatbed and document scanners."
check = { package = "scanner-support" }

[[section.entry]]
id = "enabled-cups"
title = "CUPS service"
description = "Runs the CUPS daemon required to handle print jobs and manage printers."
check = { service = "cups.socket" }
requires = { all = ["printing-support"] }

[[section.entry]]
id = "enabled-saned"
title = "SANE network"
description = "Runs the daemon that allows you to share your scanner over the local network."
check = { service = "saned.socket" }
requires = { all = ["printing-support"] }

[[section.entry]]
id = "group-cups"
title = "CUPS users"
description = "Adds your user to the cups group, granting permission to manage printers and print queues."
check = { group = "cups" }
requires = { all = ["printing-support"] }

[[section.entry]]
id = "group-scanner"
title = "Scanner users"
description = "Adds your user to the scanner group, granting permission to use document scanners."
check = { group = "scanner" }
requires = { all = ["scanning-support"] }

[[section.entry]]
id = "group-lp"
title = "LP users"
description = "Adds your user to the lp (line printer) group, required by some older printing systems."
check = { group = "lp" }
requires = { all = ["printing-support"] }

[[section]]
id = "firewall"
title = "Firewall"
icon = "security-high"

[[section.entry]]
id = "ufw"
title = "UFW"
description = "Uncomplicated Firewall. A simpler command-line interface for managing iptables/nftables firewall rules."
check = { package = "ufw" }

[[section.entry]]
id = "enabled-ufw"
title = "UFW service"
description = "Runs the UFW service to enforce your simple firewall rules."
check = { service = "ufw.service" }
requires = { all = ["ufw"] }

[[section.entry]]
id = "firewalld"
title = "Firewalld"
description = "A dynamic firewall manager that uses zones to dynamically define network trust levels and rules."
check = { package = "firewalld" }

[[section.entry]]
id = "enabled-firewalld"
title = "firewalld service"
description = "Runs the firewalld daemon to protect your system from incoming network connections."
check = { service = "firewalld.service" }
requires = { all = ["firewalld"] }

[[section.entry]]
id = "opensnitch"
title = "OpenSnitch"
description = "An application-level firewall that alerts you and asks for permission whenever a program tries to connect to the internet."
check = { package = "opensnitch" }

[[section.entry]]
id = "enabled-opensnitch"
title = "OpenSnitch service"
description = "Runs the OpenSnitch daemon to monitor application network traffic."
check = { service = "opensnitchd.service" }
requires = { all = ["opensnitch"] }

[[section]]
id = "misc"
title = "Miscellaneous"
icon = "view-list-details"

[[section.entry]]
id = "gns"
title = "Garuda Nix Subsystem"
description = "Integrates the Nix package manager, giving you access to thousands of extra software packages. Also provides a NixOS installation sharing settings with Garuda."
check = { package = "garuda-nix-subsystem" }
