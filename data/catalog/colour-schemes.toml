# Official values, untuned. The app fits text and status colours to contrast itself.
# `mode` is dark or light. `licence` is an SPDX id. `window` and `view` are the two
# background steps. `tiles` colour the icon tiles of the Install, System and Care pages.
# `ansi` is the 16 terminal colours, normal black to white then bright. Without it the
# app derives them from the roles.

[[scheme]]
id = "catppuccin-frappe"
name = "Catppuccin Frappé"
mode = "dark"
source = "https://github.com/catppuccin/palette"
licence = "MIT"
window = "#303446"
view = "#292c3c"
text = "#c6d0f5"
accent = "#ca9ee6"
on_accent = "#303446"
error = "#e78284"
warning = "#e5c890"
success = "#a6d189"
link = "#8caaee"
visited = "#babbf1"
tiles = { blue = "#8caaee", green = "#a6d189", orange = "#ef9f76" }
ansi = [
  "#51576d", "#e78284", "#a6d189", "#e5c890", "#8caaee", "#f4b8e4", "#81c8be", "#a5adce",
  "#626880", "#e67172", "#8ec772", "#d9ba73", "#7b9ef0", "#f2a4db", "#5abfb5", "#b5bfe2",
]

